[project]
name = "llm-observability-stack"
version = "0.1.0"
description = "OpenTelemetry GenAI tracing for agent runs, and a measurement of what the trace copies, what it silently under-bills, and which failures it never keeps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "James Kelly" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# scripts/real_run.py only; nothing in obs/ or tests/ imports this. The paid
# leg calls Anthropic. `gpt-5.4` has a row in obs/cost.py's price table so the
# table is not single-vendor, but pricing a model is not calling it.
real = ["anthropic>=0.60"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
